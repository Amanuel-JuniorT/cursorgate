# Companion relay on Fly.io — edit app name if taken
app = "companion-relay-aman"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  COMPANION_DATA_DIR = "/data"
  COMPANION_PWA_DIST = "/app/packages/pwa/dist"
  COMPANION_RELAY_HOST = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "companion_data"
  destination = "/data"
  initial_size = "1gb"
